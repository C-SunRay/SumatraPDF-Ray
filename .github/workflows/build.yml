name: Build Ray
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
      - name: Select Rust stable
        run: rustup default stable
      - name: Build Windows x64
        shell: pwsh
        run: ./build-ray.ps1
      - name: Unit tests
        shell: pwsh
        run: ./out/rel64/test_util.exe
      - uses: actions/upload-artifact@v6
        with:
          name: SumatraPDF-Ray-x64
          path: out/rel64/SumatraPDF-Ray.exe
          if-no-files-found: error
